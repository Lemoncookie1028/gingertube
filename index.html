
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GingerTube — Local Watch Later & Playlists (Halloween)</title>

<!-- Google Identity Services (profile-only sign-in) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- jwt-decode for decoding credential token to get profile (name/picture) -->
<script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>

<style>
/* --- Halloween theme + watermark applied --- */
:root {
  --bg:#07111b;
  --card:#071026;
  --accent:#ff784f;
  --accent-2:#ffb36b;
  --muted:#9aa8b8;
  --text:#f1f8ff;
}

/* global */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
  color:var(--text);
  background: linear-gradient(180deg,#05060a 0%, #07111b 60%);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* subtle repeating diagonal GingerTube watermark */
body::before{
  content: "GingerTube GingerTube GingerTube GingerTube GingerTube ";
  position: fixed;
  top: -20%;
  left: -30%;
  width: 160%;
  height: 160%;
  z-index: 0;
  font-size: 5rem;
  font-weight: 800;
  color: rgba(255,120,79,0.04); /* very faint orange */
  transform: rotate(-30deg);
  white-space: nowrap;
  line-height: 1.2;
  pointer-events: none;
  user-select: none;
  mix-blend-mode: overlay;
}

/* header */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  position:relative;
  z-index: 5; /* above watermark */
}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:120px;height:48px;
  background: linear-gradient(135deg,#ffb397,#ff6b4a);
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-weight:700;color:#081022;box-shadow:0 6px 24px rgba(255,100,50,0.08);
}
.controls{display:flex;gap:8px;align-items:center;flex:1;justify-content:center;z-index:5;}
.search{
  padding:8px 12px;border-radius:10px;border:0;background:rgba(255,255,255,0.03);
  color:var(--muted);min-width:260px;
  outline: none;
}
.search::placeholder{ color: rgba(155,170,185,0.6); }
.btn{
  background: linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none;padding:8px 12px;border-radius:10px;color:#081022;font-weight:700;cursor:pointer;
  box-shadow: 0 8px 30px rgba(255,110,60,0.12);
}
.btn:active{ transform: translateY(1px); }
.menu{display:flex;gap:10px;align-items:center;z-index:5;}
.menu-item{
  color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;
}
.menu-item:hover{ color:var(--accent); background: rgba(255,110,60,0.06); }

/* main layout */
main{padding:20px;position:relative;z-index:5;}
.section-title{font-size:1.1rem;margin:6px 0 14px;color:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start;}
.card{
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
  border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,0.03);overflow:hidden;
  transition: transform 220ms ease, box-shadow 220ms ease;
}
.card:hover{
  transform: translateY(-6px);
  box-shadow: 0 18px 60px rgba(0,0,0,0.6);
}
.thumb{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden;}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.meta{display:flex;align-items:center;gap:10px;margin-top:10px;}
.title{font-size:0.95rem;margin:0;color:#fff;flex:1;}
.subtitle{font-size:0.85rem;color:var(--muted);margin:0;}

/* action buttons in cards */
.play, .watchLaterBtn, .playlistBtn, .removeBtn, .removeFromPlaylistBtn {
  background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 8px;border-radius:8px;color:var(--muted);cursor:pointer;margin-left:6px;
}
.play:hover, .watchLaterBtn:hover, .playlistBtn:hover, .removeBtn:hover, .removeFromPlaylistBtn:hover {
  color:var(--accent); border-color:var(--accent);
}

/* modal player */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:60;}
.modal.open{display:flex;}
.player{width:min(1100px,96%);background:linear-gradient(180deg,#071026,#04101a);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 30px 80px rgba(0,0,0,0.7);}
.player-header{display:flex;align-items:center;gap:12px;color:var(--text);font-weight:700;}
.close{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:18px;}
iframe{width:100%;height:520px;border-radius:8px;border:0;background:#000;}

/* footer */
.footer{padding:14px 20px;color:var(--muted);font-size:0.9rem;text-align:center;margin-top:20px;position:relative;z-index:5;}

/* user info */
#userInfo{display:none;align-items:center;gap:8px;}
#userInfo img{width:36px;height:36px;border-radius:50%;}
.small-muted{color:var(--muted);font-size:0.9rem;}

/* responsive */
@media(max-width:700px){
  iframe{height:300px;}
  .controls{flex-direction:column;gap:10px;}
  .logo{width:96px;height:40px;font-size:13px;}
  body::before { font-size: 3.2rem; } /* smaller watermark on mobile */
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">GT</div>
    <div style="display:flex;flex-direction:column;">
      <div style="font-weight:700;color:#fff;">GingerTube</div>
      <div class="small-muted">Search • Watch • Save (local)</div>
    </div>
  </div>

  <div class="controls">
    <input id="globalSearch" class="search" placeholder="Search YouTube videos..." />
    <button id="searchBtn" class="btn">Search</button>

    <!-- GSI button container -->
    <div id="gsiButtonContainer" style="margin-left:8px;"></div>

    <!-- user info -->
    <div id="userInfo">
      <img id="userPic" src="" alt="user">
      <span id="userName" style="color:#fff;"></span>
      <button id="signOutBtn" class="btn" style="margin-left:8px;">Sign Out</button>
    </div>
  </div>

  <nav class="menu">
    <a href="#" class="menu-item" id="homeLink">Home</a>
    <a href="#trending" class="menu-item" id="trendingLink">Trending</a>
    <a href="#watchlater" class="menu-item" id="watchLaterLink">Watch Later</a>
    <a href="#playlists" class="menu-item" id="playlistsLink">Playlists</a>
  </nav>
</header>

<main>
  <section>
    <h3 class="section-title">Trending Now</h3>
    <div class="grid" id="trendingGrid"></div>
  </section>

  <section>
    <h3 class="section-title">Search Results</h3>
    <div class="grid" id="searchGrid"></div>
  </section>

  <section>
    <h3 class="section-title">Watch Later</h3>
    <div class="grid" id="watchLaterGrid"></div>
  </section>

  <section>
    <h3 class="section-title">Playlists</h3>
    <div class="grid" id="playlistsGrid"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="player">
    <div class="player-header">
      <div id="playerTitle" style="color:#fff;"></div>
      <button class="close" id="closeModal">✕</button>
    </div>
    <iframe id="playerFrame" src="" allowfullscreen allow="autoplay"></iframe>
  </div>
</div>

<div class="footer">GingerTube — Local Watch Later & Playlists</div>

<script>
/*
  Local-only Watch Later & Playlists version.
  - Set API_KEY to enable YouTube search/trending (optional).
  - Set CLIENT_ID to use Google Sign-In for profile only (optional).
*/

const CLIENT_ID = "922335741761-2uhalf4tckq8ji1u8e74nhkkn7teocse.apps.googleusercontent.com"; // optional: replace with yours
const API_KEY = "AIzaSyD88mpF5WWBySOGUplvgnGxPD3xXAcjp4I"; // optional: put your YouTube Data API v3 key if you want search/trending to work

// blocked lists (kept from your code)
const blockedWords = ["brainrots","skibidi","skibidi toilet","Dandy's World","steal a brainrot",];
const blockedChannels = ["Brainrot Space","jandel","sammy","Milo and Chip","Mikey Maizen - Minecraft","AI Dreamer"];

function isBlocked(title, channel){
  const t = (title||"").toLowerCase();
  const c = (channel||"").toLowerCase();
  if (blockedWords.some(w => w && t.includes(w.toLowerCase()))) return true;
  if (blockedChannels.some(ch => ch && c.includes(ch.toLowerCase()))) return true;
  return false;
}

/* UI refs */
const trendingGrid = document.getElementById('trendingGrid');
const searchGrid = document.getElementById('searchGrid');
const watchLaterGrid = document.getElementById('watchLaterGrid');
const playlistsGrid = document.getElementById('playlistsGrid');
const searchInput = document.getElementById('globalSearch');

let watchLater = JSON.parse(localStorage.getItem('watchLater') || '[]');
let playlists = JSON.parse(localStorage.getItem('playlists') || '[]');

function saveLocal(){
  localStorage.setItem('watchLater', JSON.stringify(watchLater));
  localStorage.setItem('playlists', JSON.stringify(playlists));
}

/* render generic grid */
function render(grid, videos){
  grid.innerHTML = '';
  if(!videos || videos.length === 0){
    grid.innerHTML = '<p style="color:var(--muted);text-align:center;">No results</p>';
    return;
  }
  videos.forEach(v => {
    const inWL = watchLater.some(w => w.id === v.id);
    const card = document.createElement('article');
    card.className = 'card';
    // keep title safe
    const safeTitle = escapeHTML(v.title || '');
    const channel = v.channel || '';
    card.innerHTML = `
      <div class="thumb"><img src="${v.thumb}" alt="${safeTitle}"></div>
      <div class="meta">
        <div style="flex:1;">
          <h4 class="title">${safeTitle}</h4>
          <div class="subtitle">${escapeHTML(channel)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;">
          <button class="play" data-id="${v.id}" data-title="${safeTitle}">Play</button>
          ${grid !== watchLaterGrid ? `<button class="watchLaterBtn" data-id="${v.id}" data-title="${safeTitle}">${inWL ? 'Remove' : 'Watch Later'}</button>` : `<button class="removeBtn" data-id="${v.id}">Remove</button>`}
          ${grid !== playlistsGrid ? `<button class="playlistBtn" data-id="${v.id}" data-title="${safeTitle}">+ Playlist</button>` : ''}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // wire up events
  grid.querySelectorAll('.play').forEach(btn => btn.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    const title = e.currentTarget.dataset.title;
    document.getElementById('playerTitle').textContent = title;
    document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    document.getElementById('modal').classList.add('open');
  }));

  grid.querySelectorAll('.watchLaterBtn').forEach(btn => btn.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    const title = e.currentTarget.dataset.title;
    const idx = watchLater.findIndex(w => w.id === id);
    if(idx >= 0){
      // remove
      watchLater.splice(idx,1);
      e.currentTarget.textContent = 'Watch Later';
    } else {
      watchLater.push({id, title});
      e.currentTarget.textContent = 'Remove';
    }
    saveLocal();
    render(watchLaterGrid, watchLater);
  }));

  grid.querySelectorAll('.removeBtn').forEach(btn => btn.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    watchLater = watchLater.filter(w => w.id !== id);
    saveLocal();
    render(watchLaterGrid, watchLater);
  }));

  grid.querySelectorAll('.playlistBtn').forEach(btn => btn.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    const title = e.currentTarget.dataset.title;
    const name = prompt('Enter playlist name:');
    if(!name) return;
    let pl = playlists.find(p => p.name === name);
    if(!pl){
      playlists.push({name, videos:[{id,title}]});
    } else {
      if(!pl.videos.some(v => v.id === id)) pl.videos.push({id,title});
    }
    saveLocal();
    renderPlaylists();
    alert(`Added to playlist "${name}"`);
  }));
}

/* render playlists */
function renderPlaylists(){
  playlistsGrid.innerHTML = '';
  if(!playlists || playlists.length === 0){
    playlistsGrid.innerHTML = '<p style="color:var(--muted);text-align:center;">No playlists</p>';
    return;
  }
  playlists.forEach(pl => {
    const section = document.createElement('div');
    section.innerHTML = `<h4 style="color:#fff;">${escapeHTML(pl.name)}</h4>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    pl.videos.forEach(v => {
      const card = document.createElement('article');
      card.className = 'card';
      const safeTitle = escapeHTML(v.title || '');
      card.innerHTML = `
        <div class="thumb"><img src="${v.thumb || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}" alt="${safeTitle}"></div>
        <div class="meta">
          <div style="flex:1;"><h4 class="title">${safeTitle}</h4></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;">
            <button class="play" data-id="${v.id}" data-title="${safeTitle}">Play</button>
            <button class="removeFromPlaylistBtn" data-id="${v.id}" data-pl="${escapeHTML(pl.name)}">Remove</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    playlistsGrid.appendChild(section);

    section.querySelectorAll('.play').forEach(btn => btn.addEventListener('click', e => {
      const id = e.currentTarget.dataset.id;
      const title = e.currentTarget.dataset.title;
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      document.getElementById('modal').classList.add('open');
    }));

    section.querySelectorAll('.removeFromPlaylistBtn').forEach(btn => btn.addEventListener('click', e => {
      const id = e.currentTarget.dataset.id;
      const plName = e.currentTarget.dataset.pl;
      const p = playlists.find(x => x.name === plName);
      if(p){
        p.videos = p.videos.filter(v => v.id !== id);
        if(p.videos.length === 0) playlists = playlists.filter(x => x.name !== plName);
        saveLocal();
        renderPlaylists();
      }
    }));
  });
}

/* helpers */
function escapeHTML(s){ return String(s).replace(/[&<>\"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* modal close */
document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('playerFrame').src = '';
  document.getElementById('modal').classList.remove('open');
});

/* Fetch YouTube API (if API_KEY provided) */
async function fetchYouTube(url){
  try{
    const res = await fetch(url);
    const data = await res.json();
    if(!data.items) return [];
    const mapped = data.items.map(item => {
      // handle different shapes returned by search vs videos endpoints
      const id = item.id && (item.id.videoId || item.id);
      const snippet = item.snippet || {};
      return {
        id,
        title: snippet.title || '',
        thumb: (snippet.thumbnails && snippet.thumbnails.high && snippet.thumbnails.high.url) || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
        channel: snippet.channelTitle || ''
      };
    });
    return mapped.filter(v => !isBlocked(v.title, v.channel));
  } catch(err){
    console.error('YouTube fetch error', err);
    return [];
  }
}

async function loadTrending(){
  if(!API_KEY){
    trendingGrid.innerHTML = '<p style="color:var(--muted);text-align:center;">Trending disabled (API_KEY not set)</p>';
    return;
  }
  const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=12&regionCode=US&key=${API_KEY}`;
  const videos = await fetchYouTube(url);
  render(trendingGrid, videos);
}

async function searchVideos(){
  const q = searchInput.value.trim();
  if(!q) return;
  if(!API_KEY){
    searchGrid.innerHTML = '<p style="color:var(--muted);text-align:center;">Search disabled (API_KEY not set)</p>';
    return;
  }
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(q)}&key=${API_KEY}`;
  const videos = await fetchYouTube(url);
  render(searchGrid, videos);
}

/* menu wiring */
document.getElementById('searchBtn').addEventListener('click', searchVideos);
searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') searchVideos(); });
document.getElementById('homeLink').addEventListener('click', loadTrending);
document.getElementById('trendingLink').addEventListener('click', loadTrending);
document.getElementById('watchLaterLink').addEventListener('click', () => render(watchLaterGrid, watchLater));
document.getElementById('playlistsLink').addEventListener('click', renderPlaylists);

/* Initial render */
loadTrending();
render(watchLaterGrid, watchLater);
renderPlaylists();

/* ---------------------------
   Google Sign-In (profile only)
   --------------------------- */

const gsiContainer = document.getElementById('gsiButtonContainer');
const userInfoEl = document.getElementById('userInfo');

function handleCredentialResponse(response){
  try{
    const profile = jwt_decode(response.credential); // {name, picture, email, ...}
    // show profile UI
    document.getElementById('userName').textContent = profile.name || profile.email || 'User';
    document.getElementById('userPic').src = profile.picture || '';
    userInfoEl.style.display = 'flex';
    gsiContainer.style.display = 'none';
    // persist to session storage (optional)
    sessionStorage.setItem('gt_profile', JSON.stringify(profile));
  } catch(e){
    console.error('failed to decode credential', e);
  }
}

function initGSI(){
  // render GSI button and prompt if client id available
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.id){
    console.warn('Google Identity Services not loaded');
    return;
  }
  // If CLIENT_ID is empty, we don't render the official button but keep a simple fallback
  if(!CLIENT_ID || CLIENT_ID.trim().length === 0){
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'Sign in (no CLIENT_ID)';
    btn.disabled = true;
    gsiContainer.appendChild(btn);
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse,
    ux_mode: 'popup'
  });

  // render the GSI button
  google.accounts.id.renderButton(
    gsiContainer,
    { theme: 'outline', size: 'large', width: 180 }
  );

  // auto prompt (optional)
  // google.accounts.id.prompt(); // commented to avoid intrusive prompt
}

// restore profile from session if present
(function restoreProfile(){
  const s = sessionStorage.getItem('gt_profile');
  if(s){
    try{
      const p = JSON.parse(s);
      document.getElementById('userName').textContent = p.name || p.email || 'User';
      document.getElementById('userPic').src = p.picture || '';
      userInfoEl.style.display = 'flex';
      gsiContainer.style.display = 'none';
    } catch(e){}
  }
})();

document.getElementById('signOutBtn').addEventListener('click', () => {
  // simple sign out: clear session and show button again
  sessionStorage.removeItem('gt_profile');
  userInfoEl.style.display = 'none';
  gsiContainer.style.display = 'block';
  // disable auto-select for GSI if available
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
});

/* init GSI once scripts are ready */
window.addEventListener('load', () => {
  // small delay to ensure google.accounts is available (external script async)
  setTimeout(initGSI, 200);
});
</script>
</body>
</html>
